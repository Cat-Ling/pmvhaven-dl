name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to embed (defaults to tag name or v1.0.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            APP_VERSION="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF_NAME}"
          else
            APP_VERSION="v1.0.0"
          fi
          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved build version: ${APP_VERSION}"

      - name: Build cross-platform binaries
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [[ "${GOOS}" == "windows" ]]; then
              EXT=".exe"
            fi
            OUT="dist/pmvhaven-dl-${GOOS}-${GOARCH}${EXT}"
            echo "Building ${OUT} (${APP_VERSION})..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X main.version=${APP_VERSION}" -o "${OUT}" main.go
          done

          (
            cd dist
            sha256sum pmvhaven-dl-* > SHA256SUMS.txt
          )
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmvhaven-dl-${{ steps.meta.outputs.version }}-binaries
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist/*
